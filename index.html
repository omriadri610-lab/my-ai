<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff;
      color: #111;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      height: 60px;
      border-bottom: 1px solid #ddd;
      display: flex;
      align-items: center;
      padding: 0 20px;
      font-size: 20px;
      font-weight: bold;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 25px 15px 110px;
      width: 100%;
      max-width: 850px;
      margin: auto;
    }

    .welcome {
      text-align: center;
      margin-top: 20vh;
    }

    .welcome h1 {
      font-size: 34px;
      margin-bottom: 10px;
    }

    .welcome p {
      color: #666;
    }

    .message {
      max-width: 80%;
      padding: 13px 16px;
      margin: 15px 0;
      border-radius: 16px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .user {
      margin-left: auto;
      background: #eee;
    }

    .ai {
      margin-right: auto;
      background: #f6f6f6;
    }

    #inputArea {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: white;
      border-top: 1px solid #ddd;
      padding: 12px;
    }

    #inputBox {
      max-width: 850px;
      margin: auto;
      display: flex;
      gap: 8px;
    }

    textarea {
      flex: 1;
      min-height: 48px;
      max-height: 150px;
      resize: none;
      border: 1px solid #ccc;
      border-radius: 14px;
      padding: 13px;
      font-size: 16px;
      outline: none;
    }

    button {
      border: 0;
      border-radius: 14px;
      background: #111;
      color: white;
      padding: 0 18px;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
    }
  </style>
</head>

<body>

<header>
  🤖 My AI
</header>

<div id="chat">

  <div class="welcome" id="welcome">
    <h1>How can I help?</h1>
    <p>Ask me anything.</p>
  </div>

</div>

<div id="inputArea">
  <div id="inputBox">

    <textarea
      id="message"
      placeholder="Message My AI..."
      rows="1"
    ></textarea>

    <button id="send">
      Send
    </button>

  </div>
</div>

<script>

const chat = document.getElementById("chat");
const messageInput = document.getElementById("message");
const sendButton = document.getElementById("send");
const welcome = document.getElementById("welcome");

function addMessage(text, type) {

  if (welcome) {
    welcome.remove();
  }

  const message = document.createElement("div");

  message.className = "message " + type;

  message.textContent = text;

  chat.appendChild(message);

  chat.scrollTop = chat.scrollHeight;

  return message;
}

async function sendMessage() {

  const message = messageInput.value.trim();

  if (!message) return;

  messageInput.value = "";

  sendButton.disabled = true;

  addMessage(message, "user");

  const loading = addMessage("Thinking...", "ai");

  try {

    const response = await fetch("/api/chat", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        message: message
      })

    });

    const data = await response.json();

    loading.remove();

    if (!response.ok) {

      addMessage(
        "Error: " + (data.error || "Something went wrong."),
        "ai"
      );

      return;
    }

    addMessage(
      data.reply || "No response.",
      "ai"
    );

  } catch (error) {

    loading.remove();

    addMessage(
      "Could not connect to the AI server.",
      "ai"
    );

  } finally {

    sendButton.disabled = false;

    messageInput.focus();
  }
}

sendButton.addEventListener(
  "click",
  sendMessage
);

messageInput.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      sendMessage();
    }

  }
);

</script>

</body>
</html>
