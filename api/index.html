<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #111111;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      height: 60px;
      border-bottom: 1px solid #e5e5e5;
      display: flex;
      align-items: center;
      padding: 0 18px;
      font-weight: bold;
      font-size: 20px;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 25px 15px 120px;
      max-width: 850px;
      width: 100%;
      margin: auto;
    }

    .message {
      margin: 15px 0;
      padding: 13px 16px;
      border-radius: 15px;
      max-width: 80%;
      white-space: pre-wrap;
      line-height: 1.5;
    }

    .user {
      background: #eeeeee;
      margin-left: auto;
    }

    .ai {
      background: #f7f7f7;
      margin-right: auto;
    }

    .welcome {
      text-align: center;
      margin-top: 20vh;
      color: #555;
    }

    .welcome h1 {
      color: #111;
      font-size: 32px;
    }

    #inputArea {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      border-top: 1px solid #e5e5e5;
      padding: 12px;
    }

    #inputBox {
      max-width: 850px;
      margin: auto;
      display: flex;
      gap: 8px;
    }

    textarea {
      flex: 1;
      resize: none;
      border: 1px solid #ccc;
      border-radius: 14px;
      padding: 13px;
      font-size: 16px;
      min-height: 48px;
      outline: none;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 0 18px;
      background: #111;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
    }
  </style>
</head>

<body>

<header>
  🤖 My AI
</header>

<div id="chat">
  <div class="welcome" id="welcome">
    <h1>How can I help?</h1>
    <p>Ask me anything.</p>
  </div>
</div>

<div id="inputArea">
  <div id="inputBox">
    <textarea id="message" placeholder="Message My AI..." rows="1"></textarea>
    <button id="send">Send</button>
  </div>
</div>

<script>
  const messageInput = document.getElementById("message");
  const sendButton = document.getElementById("send");
  const chat = document.getElementById("chat");
  const welcome = document.getElementById("welcome");

  function addMessage(text, type) {
    if (welcome) {
      welcome.remove();
    }

    const div = document.createElement("div");
    div.className = "message " + type;
    div.textContent = text;

    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;

    return div;
  }

  async function sendMessage() {
    const message = messageInput.value.trim();

    if (!message) return;

    messageInput.value = "";
    sendButton.disabled = true;

    addMessage(message, "user");

    const loading = addMessage("Thinking...", "ai");

    try {
      const response = await fetch("/api/chat", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message: message
        })
      });

      const data = await response.json();

      loading.remove();

      if (!response.ok) {
        addMessage(
          "Error: " + (data.error || "Something went wrong."),
          "ai"
        );
        return;
      }

      addMessage(data.reply || "No response.", "ai");

    } catch (error) {
      loading.remove();
      addMessage(
        "Could not connect to the AI server.",
        "ai"
      );
    } finally {
      sendButton.disabled = false;
      messageInput.focus();
    }
  }

  sendButton.addEventListener("click", sendMessage);

  messageInput.addEventListener("keydown", function(event) {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      sendMessage();
    }
  });
</script>

</body>
</html>
